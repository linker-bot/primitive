[develop]
script_dir=$base/lib/hand_gesture_primitives
[install]
install_scripts=$base/lib/hand_gesture_primitives

[tool:pytest]
# launch_testing 插件的 collect 钩子会让目录级收集静默返回 0 个用例（单文件不受影响）。
# 本包无 launch test（无 generate_test_description），故禁用该插件及其依赖方 launch_ros。
testpaths = test
addopts = -p no:launch_testing -p no:launch_ros
