# LinkerHand L25 关节配置
# 25-DOF, 弯曲/拇指方向与 O20 相反, 指尖与指中耦合
#
# L25 布局:
#   [0-4]   指根弯曲 (255=张开, 0=弯曲)
#   [5]     拇指侧摆 (255=外展, 0=内收)
#   [6-9]   四指侧摆 (方向同 O20)
#   [10]    拇指旋转 (255=自然位, 0=最大旋转)
#   [11-14] 保留位 (默认 255)
#   [15-19] 指中弯曲 (255=伸直, 0=弯曲)
#   [20-24] 指尖弯曲 (随指中耦合)

hand_joint: L25
num_joints: 25

joint_names:
  - thumb_base
  - index_base
  - middle_base
  - ring_base
  - pinky_base
  - thumb_abd
  - index_abd
  - middle_abd
  - ring_abd
  - pinky_abd
  - thumb_rot
  - rsv_11
  - rsv_12
  - rsv_13
  - rsv_14
  - thumb_mid
  - index_mid
  - middle_mid
  - ring_mid
  - pinky_mid
  - thumb_tip
  - index_tip
  - middle_tip
  - ring_tip
  - pinky_tip

# O20 内部索引 → L25 硬件索引映射
# invert: true 表示 hw_val = 255 - o20_val
# also: 额外复制到的硬件索引 (耦合关节)
from_o20:
  0:  {to: 0,  invert: true}
  1:  {to: 1,  invert: true}
  2:  {to: 2,  invert: true}
  3:  {to: 3,  invert: true}
  4:  {to: 4,  invert: true}
  5:  {to: 5,  invert: true}
  6:  {to: 6,  invert: false}
  7:  {to: 7,  invert: false}
  8:  {to: 8,  invert: false}
  9:  {to: 9,  invert: false}
  10: {to: 10, invert: true}
  15: {to: 15, invert: true, also: [20]}
  16: {to: 16, invert: true, also: [21]}
  17: {to: 17, invert: true, also: [22]}
  18: {to: 18, invert: true, also: [23]}
  19: {to: 19, invert: true, also: [24]}

from_semantic:
  thumb_mcp_flex: { joint: thumb_base, invert: true }
  thumb_mcp_abd: { joint: thumb_abd, invert: true }
  thumb_dip: { joint: thumb_mid, invert: true, also: [thumb_tip] }
  thumb_rot: { joint: thumb_rot, invert: true }
  index_mcp_flex: { joint: index_base, invert: true }
  index_mcp_abd: { joint: index_abd, invert: false }
  index_dip: { joint: index_mid, invert: true, also: [index_tip] }
  middle_mcp_flex: { joint: middle_base, invert: true }
  middle_mcp_abd: { joint: middle_abd, invert: false }
  middle_dip: { joint: middle_mid, invert: true, also: [middle_tip] }
  ring_mcp_flex: { joint: ring_base, invert: true }
  ring_mcp_abd: { joint: ring_abd, invert: false }
  ring_dip: { joint: ring_mid, invert: true, also: [ring_tip] }
  pinky_mcp_flex: { joint: pinky_base, invert: true }
  pinky_mcp_abd: { joint: pinky_abd, invert: false }
  pinky_dip: { joint: pinky_mid, invert: true, also: [pinky_tip] }

convergence:
  - thumb_mcp_flex
  - index_mcp_flex
  - middle_mcp_flex
  - ring_mcp_flex
  - pinky_mcp_flex
  - thumb_mcp_abd
  - thumb_rot


reserved:
  indices: [11, 12, 13, 14]
  default: 255

# 校准偏移 (硬件单位, 在方向转换后施加)
# 用于补偿 L25 与 O20 不同机械结构导致的姿态偏差
# 键为硬件索引, 值为偏移量 (正=增大, 负=减小), 结果 clamp 到 [0, 255]
calibration:
  # 拇指校准 (调整后拇食指对头)
  # 5: -10    # thumb_abd: 负值=更内收
  # 10: +15   # thumb_rot: 正值=更接近自然位

# 正运动学配置 (FK)
# o20_to_urdf_joint: O20 通道索引 → URDF 关节名 (仅映射 actuated joints)
# fingertip_links: URDF 中各指尖 link 名 (顺序: thumb, index, middle, ring, pinky)
# base_link: FK 计算的参考坐标系 (URDF 根 link)
# urdf_model: URDF 目录/文件中的型号标识
fk:
  urdf_model: l25
  base_link: hand_base_link
  fingertip_links:
    - thumb_distal
    - index_distal
    - middle_distal
    - ring_distal
    - pinky_distal
  # 指肚接触面偏移 (link 局部坐标系, 单位: 米)
  # L25 distal link 长约 23mm (从 DIP 前方), 指肚在 ~65% 处 + 掌侧 10mm
  # [x, y, z]: x=掌侧(正), y=侧向, z=沿骨方向(指尖)
  tip_offsets:
    thumb_distal:  [0.003, 0.0, 0.020]
    index_distal:  [0.010, 0.0, 0.015]
    middle_distal: [0.010, 0.0, 0.015]
    ring_distal:   [0.010, 0.0, 0.015]
    pinky_distal:  [0.010, 0.0, 0.015]
  o20_to_urdf_joint:
    0:  thumb_cmc_pitch
    1:  index_mcp_pitch
    2:  middle_mcp_pitch
    3:  ring_mcp_pitch
    4:  pinky_mcp_pitch
    5:  thumb_cmc_yaw
    6:  index_mcp_roll
    7:  middle_mcp_roll
    8:  ring_mcp_roll
    9:  pinky_mcp_roll
    10: thumb_cmc_roll
    15: thumb_mcp
    16: index_pip
    17: middle_pip
    18: ring_pip
    19: pinky_pip

capabilities:
  finger_abd: true
  thumb_abd: true
  thumb_rot: true
  finger_tips: true
  thumb_tip: true
  finger_root2: true
  vision_fk: true
  touch: true
  current: true

primitives:
  mode: allowlist
  supported:
    - init
    - open
    - release
    - relax_grip
    - fist
    - pinch
    - grasp_ready
    - point
    - ok_sign
    - v_sign
    - thumb_adduction_grip
    - index_middle_adduction_grip
    - tripod
    - tripod_by_force
    - ring
    - middle_ring
    - index_pinch
    - middle_pinch
    - parallel_extension
    - index_ring_by_vision
    - large_wrap_by_vision
    - middle_ring_by_vision
    - ring_by_vision
    - small_warp_by_vision
    - no_index_warp_by_vision
    - hook_by_vision
    - index_pinch_by_vision
    - middle_pinch_by_vision
    - tripod_by_vision
    - palmar_by_vision
    - parallel_extension_by_vision
    - disk_by_vision
    - index_flick
    - index_middle_flick
    - twist2digit
    - twist3digit
    - twist5digit
    - named_pose
  grasp_type_map:
    precision: index_ring_by_vision
    lateral: index_middle_adduction_grip
    power: large_wrap_by_vision

# ==============================================================================
# gestures — 静态/力控原语姿态（O20 语义角，经 HandConfig 映射到 L25）
# ==============================================================================

gestures:
  # --------------------------------------------------------------------------
  # init — 半开自然待机（对齐 O20 _init_o20；与 open 全开区分）
  # --------------------------------------------------------------------------
  init:
    angles:
      space: semantic_o20
      target:
        thumb_base: 80
        index_base: 80
        middle_base: 80
        ring_base: 80
        pinky_base: 80
        thumb_abd: 60
        index_abd: 128
        middle_abd: 128
        ring_abd: 128
        pinky_abd: 128
        thumb_rot: 50
        thumb_tip: 60
        index_tip: 60
        middle_tip: 60
        ring_tip: 60
        pinky_tip: 60
    motion:
      type: static
      duration: 0.8
  # --------------------------------------------------------------------------
  # open — 五指完全张开
  # --------------------------------------------------------------------------
  open:
    angles:
      space: semantic_o20
      target:
        thumb_base: 0
        index_base: 0
        middle_base: 0
        ring_base: 0
        pinky_base: 0
        thumb_abd: 0
        index_abd: 128
        middle_abd: 128
        ring_abd: 128
        pinky_abd: 128
        thumb_rot: 0
        thumb_tip: 0
        index_tip: 0
        middle_tip: 0
        ring_tip: 0
        pinky_tip: 0
    motion:
      type: static
      duration: 0.6

  # --------------------------------------------------------------------------
  # 下列可规划原语：空 target → gesture_params builder（供 PlanGesture / 出厂预设）
  # --------------------------------------------------------------------------
  fist:
    angles:
      space: semantic_o20
      target: {}
    motion:
      type: phased_pose
      phase1: 0.5
      phase2: 0.4
      phase3: 0.4
      phase4: 0.4
    joints:
      hold: [0, 5, 10, 15]

  grasp_ready:
    angles:
      space: semantic_o20
      target: {}
    motion:
      type: static
      duration: 0.8

  point:
    angles:
      space: semantic_o20
      target: {}
    motion:
      type: static
      duration: 0.6

  v_sign:
    angles:
      space: semantic_o20
      target: {}
    motion:
      type: static
      duration: 0.6

  release:
    motion:
      type: static
      duration: 0.6

  relax_grip:
    motion:
      type: relax_grip
      duration: 0.6
      hold_duration: 0.3
      grip_duration: 0.4

  # --------------------------------------------------------------------------
  # pinch — 拇指-食指对捏 (StaticPoseEngine)
  # 目标姿由 gesture_params._pinch_l25（BotClaw 标定）提供；勿再写 O20 弱半弯
  # （L25 invert 下 index_base:120 硬件仅中等弯曲，对指失败）。空 target → builder。
  # --------------------------------------------------------------------------
  pinch:
    angles:
      space: semantic_o20
      target: {}
    motion:
      type: static
      duration: 0.5

  # --------------------------------------------------------------------------
  # ok_sign — OK 手势 (StaticPoseEngine)
  # 目标姿由 gesture_params._ok_sign_l25 提供；空 target → builder。
  # --------------------------------------------------------------------------
  ok_sign:
    angles:
      space: semantic_o20
      target: {}
    motion:
      type: static
      duration: 0.6


  # --------------------------------------------------------------------------
  # thumb_adduction_grip — 拇指侧向夹持
  #   engine="rot_progressive" → RotProgressiveEngine (新引擎)
  #   P1: 所有关节 lerp 到位 (phase1=0.35s)
  #   P2: thumb_rot 从 20 渐进到 abd_max=120 (rate=20/s)
  # --------------------------------------------------------------------------
  thumb_adduction_grip:
    engine: "rot_progressive"  # "" = 旧PhasedLerpEngine, "rot_progressive" = 新引擎
    angles:
      space: semantic_o20
      target:
        thumb_base: 150          # 拇指根部就位 (O20 语义: 较大=弯曲)
        thumb_abd: 130           # 拇指侧摆内扣 (接近手掌)
        thumb_rot: 20            # ★ P1 终点: 拇指旋转到 20 (之后渐进到 120)
        thumb_tip: 100           # 拇指指尖弯曲
        index_base: 220          # 食指根部 (配合拇指形成侧向夹持面)
        middle_base: 220         # 中指根部
        ring_base: 220           # 无名指根部
        pinky_base: 220          # 小指根部
        index_tip: 120           # 食指指尖
        middle_tip: 170          # 中指指尖
        ring_tip: 170            # 无名指指尖
        pinky_tip: 170           # 小指指尖
    motion:
      phase1: 0.35               # P1: 所有关节 lerp 到 target 的时长 (秒)
      phase2: 0.0                # 新引擎不使用 P2/3/4 (由 progressive 控制)
      phase3: 0.0
      phase4: 0.0
    joints:
      hold: []                   # 新引擎无 hold 逻辑 (无需锁定的关节)
      flex: []                   # 新引擎无 flex 阶段
      rot: 10                    # ★ rot 关节索引 = thumb_rot (渐进关节)
    progressive:
      abd: -1                    # -1 = 不渐进 abd (新引擎只用 rot 渐进)
      flex: -1                   # -1 = 不渐进 flex
      abd_max: 120               # ★ rot 渐进终点 (O20 语义: 120=旋转接近对捏位)
      flex_max: 255
      rate: 20.0                 # rot 渐进速率 (O20 语义单位/秒)
    contact:
      fingers: [0, 1]            # 接触检测: 拇指[0]+食指[1]，触发即冻结 rot

  # --------------------------------------------------------------------------
  # index_middle_adduction_grip — 食中指侧向夹持
  #   engine="finger_adduction" → FingerAdductionEngine (新引擎)
  #   P0: 拇指先行 (0.3s, 关节 [0,5,10,15] 先到位)
  #   P1: 其余关节到位 (0.5s, abd 在张开位: index_abd=255, middle_abd=0)
  #   P2: 食中指侧摆渐进并拢 (2.0s, index_abd: 255→96, middle_abd: 0→160)
  #        接触检测触发即冻结。
  # --------------------------------------------------------------------------
  index_middle_adduction_grip:
    engine: "finger_adduction"   # "" = 旧硬编码4阶段, "finger_adduction" = 新引擎
    angles:
      space: semantic_o20
      target:
        thumb_base: 128          # 拇指根部（勿 178+255 rot/abd 组合，L25 invert 会拧到底）
        thumb_abd: 115           # 拇指侧摆内收（勿 255→hw0）
        thumb_rot: 140           # 与 pinch 族一致；勿 255→hw0
        thumb_tip: 100           # 拇指指尖
        index_base: 120          # 食指根部弯曲 (形成夹持弧面)
        middle_base: 120         # 中指根部弯曲 (对称)
        ring_base: 255           # 无名指握拢 (避让)
        pinky_base: 255          # 小指握拢 (避让)
        index_abd: 255           # ★ P1 终点: 食指侧摆张开 (>128=尺侧外展, 远离中指)
        middle_abd: 0            # ★ P1 终点: 中指侧摆张开 (<128=桡侧外展, 远离食指)；须为显式 0
        ring_abd: 128            # 无名指侧摆中立
        pinky_abd: 128           # 小指侧摆中立
        index_tip: 100           # 食指指尖弯曲
        middle_tip: 100          # 中指指尖弯曲
        ring_tip: 255            # 无名指指尖握拢
        pinky_tip: 255           # 小指指尖握拢
    thumb:                        # P0: 拇指先行阶段
      joints: [0, 5, 10, 15]     # 先行关节: base/abd/rot/tip
      duration: 0.3              # 先行时长 (秒)
    motion:
      phase1: 0.5                # P1: 其余关节到位时长 (秒)
    adduction:                    # P2: 双关节渐进并拢
      joint_a: 6                 # 渐进关节A: index_abd (O20 idx)
      joint_b: 7                 # 渐进关节B: middle_abd (O20 idx)
      close_a: 96                # A 并拢终点 (<128=向尺侧并拢)
      close_b: 160               # B 并拢终点 (>128=向桡侧并拢)
      duration: 2.0              # 并拢时长 (秒)
    contact:
      fingers: [1, 2]            # 接触检测: 食指[1]+中指[2]，触发即冻结

  # --------------------------------------------------------------------------
  # tripod — 三指捏取 (PhasedPoseEngine)
  # 目标姿由 gesture_params._tripod_l25 提供；空 target → builder。
  # --------------------------------------------------------------------------
  tripod:
    angles:
      space: semantic_o20
      target: {}
    motion:
      type: phased_pose       # P1→P4 分阶段执行
      phase1: 0.5             # P1: 非 hold 关节 → target (四指就位)
      phase2: 0.4             # P2: thumb_abd[5] → target (侧摆到位)
      phase3: 0.4             # P3: thumb_rot[10] → target (旋转到位)
      phase4: 0.4             # P4: hold 关节放开 → 全部到位
    joints:
      hold: [0, 5, 10]        # P1 锁定拇指 base/abd/rot (tip 随四指一起到位)
    stages:
      prep: 0.5               # tripod prep：侧摆/旋转就位，屈曲保持 init
      close: 0.5              # tripod close：只闭合拇/食/中
      pause: 0.0

  # --------------------------------------------------------------------------
  # tripod_by_force — 复用上方 tripod 运动，闭合时逐指电流/触觉停指
  # --------------------------------------------------------------------------
  tripod_by_force:
    contact:
      fingers: [thumb, index, middle]
      feedback_source: auto   # 触觉优先，否则关节电流 Δ (mA)
      require_feedback: false

  # --------------------------------------------------------------------------
  # index_pinch — 食指对捏 (StaticPoseEngine)
  # 目标姿由 gesture_params._index_pinch_l25 提供；空 target → builder。
  # --------------------------------------------------------------------------
  index_pinch:
    angles:
      space: semantic_o20
      target: {}
    motion:
      type: static            # 所有关节同时平滑 lerp
      duration: 0.5           # 到位时长 (秒)

  # --------------------------------------------------------------------------
  # middle_pinch — 中指对捏 (StaticPoseEngine)
  # 目标姿由 gesture_params._middle_pinch_l25 提供；空 target → builder。
  # --------------------------------------------------------------------------
  middle_pinch:
    angles:
      space: semantic_o20
      target: {}
    motion:
      type: static            # 所有关节同时平滑 lerp
      duration: 0.5           # 到位时长 (秒)

  # --------------------------------------------------------------------------
  # disk_by_vision — 抓盘子 (StaticPoseEngine)
  # --------------------------------------------------------------------------
  disk_by_vision:
    angles:
      space: semantic_o20
      target:
        thumb_base: 200        # 拇指根部弯曲 (从 255 降下)
        index_base: 140        # 食指根部 C 弧
        middle_base: 140       # 中指根部 C 弧
        ring_base: 140         # 无名指根部 C 弧
        pinky_base: 140        # 小指根部 C 弧
        thumb_abd: 200         # 拇指侧摆对齐中指 (从 255 降下)
        index_abd: 128         # 食指侧摆中立
        middle_abd: 128        # 中指侧摆中立
        ring_abd: 128          # 无名指侧摆中立
        pinky_abd: 128         # 小指侧摆中立
        thumb_rot: 200         # 拇指旋转 (从 255 降下)
        thumb_tip: 200         # 拇指指尖弯曲 (从 255 降下)
        index_tip: 130         # 食指指尖 C 弧
        middle_tip: 130        # 中指指尖 C 弧
        ring_tip: 130          # 无名指指尖 C 弧
        pinky_tip: 130         # 小指指尖 C 弧
    motion:
      type: static
      duration: 1.4

  # --------------------------------------------------------------------------
  # index_pinch_by_vision — 食指对捏视觉版；姿态同 _index_pinch_l25
  # --------------------------------------------------------------------------
  index_pinch_by_vision:
    angles:
      space: semantic_o20
      target: {}
    motion:
      type: static
      duration: 0.5

  # --------------------------------------------------------------------------
  # middle_pinch_by_vision — 中指对捏视觉版；姿态同 _middle_pinch_l25
  # --------------------------------------------------------------------------
  middle_pinch_by_vision:
    angles:
      space: semantic_o20
      target: {}
    motion:
      type: static
      duration: 0.5

  # --------------------------------------------------------------------------
  # parallel_extension_by_vision — 平行伸展视觉版 (StaticPoseEngine)
  # --------------------------------------------------------------------------
  parallel_extension_by_vision:
    angles:
      space: semantic_o20
      target:
        thumb_base: 120        # 拇指根部
        index_base: 235        # 食指根部
        middle_base: 235       # 中指根部
        ring_base: 235         # 无名指根部
        pinky_base: 235        # 小指根部
        thumb_abd: 235         # 拇指外展张开
        index_abd: 193         # 食指内收并拢
        middle_abd: 150        # 中指内收并拢
        ring_abd: 105          # 无名指内收并拢
        pinky_abd: 45          # 小指内收并拢
        thumb_rot: 245         # 拇指旋转使指腹平行
    motion:
      type: static
      duration: 0.6

  # --------------------------------------------------------------------------
  # parallel_extension — 平行伸展无视觉版 (StaticPoseEngine)
  # --------------------------------------------------------------------------
  parallel_extension:
    angles:
      space: semantic_o20
      target:
        thumb_base: 120
        index_base: 235
        middle_base: 235
        ring_base: 235
        pinky_base: 235
        thumb_abd: 235
        index_abd: 193
        middle_abd: 150
        ring_abd: 105
        pinky_abd: 45
        thumb_rot: 245
    motion:
      type: static
      duration: 0.6

  # --------------------------------------------------------------------------
  # index_ring_by_vision — 食指环形包络视觉版 (StaticPoseEngine)
  # --------------------------------------------------------------------------
  index_ring_by_vision:
    angles:
      space: semantic_o20
      target:
        thumb_base: 200        # 拇指根部弯曲
        index_base: 130        # 食指根部弯曲
        thumb_abd: 190         # 拇指侧摆对准食指
        thumb_rot: 120         # 拇指旋转对准食指
        thumb_tip: 175         # 拇指指尖弯曲
        index_tip: 110         # 食指指尖弯曲
    motion:
      type: static
      duration: 0.9

  # --------------------------------------------------------------------------
  # large_wrap_by_vision — 大物体包络视觉版 (StaticPoseEngine)
  # --------------------------------------------------------------------------
  large_wrap_by_vision:
    angles:
      space: semantic_o20
      target:
        thumb_base: 200        # 拇指根部弯曲
        index_base: 220        # 食指根部深度弯曲
        middle_base: 220       # 中指根部深度弯曲
        ring_base: 220         # 无名指根部深度弯曲
        pinky_base: 220        # 小指根部深度弯曲
        thumb_abd: 175         # 拇指外展对掌
        thumb_rot: 210         # 拇指旋转对向四指
        thumb_tip: 200         # 拇指指尖弯曲
        index_tip: 210         # 食指指尖弯曲
        middle_tip: 210        # 中指指尖弯曲
        ring_tip: 210          # 无名指指尖弯曲
        pinky_tip: 210         # 小指指尖弯曲
    motion:
      type: static
      duration: 1.55

  # --------------------------------------------------------------------------
  # ring_by_vision — 环形包络视觉版 thumb_rot
  # --------------------------------------------------------------------------
